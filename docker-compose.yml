version: '3.8'

services:
  homebrain:
    image: python:3.12-slim
    working_dir: /app
    command: python -m homebrain.server
    volumes:
      - ./:/app
    ports:
      - "8787:8787"
    environment:
      HOMEBRAIN_HOST: 0.0.0.0
      HOMEBRAIN_PORT: 8787
      # Optionally lock down API POST calls from third-party AI clients.
      # HOMEBRAIN_API_TOKEN: change-me
    restart: unless-stopped

  llama-cpp:
    image: ghcr.io/ggml-org/llama.cpp:server
    command: ["-m", "/models/model.gguf", "--alias", "homebrain-coder", "--ctx-size", "8192", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      - "8080:8080"
    volumes:
      - ./models:/models:ro
    restart: unless-stopped

  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    ports:

      - "8096:8096"  # Web interface
      - "3344:3344"  # Streaming port
    volumes:


      - ~/Movies:/movies  # macOS Movies folder
      - ~/Music:/music    # macOS Music folder
      - ~/TV\ Shows:/tvshows  # macOS TV Shows folder (note: backslash escape for space)
    restart: unless-stopped

  pihole:
    image: pihole/pihole:latest
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "8081:80"
    environment:
      TZ: UTC
    volumes:
      - pihole-config:/etc/pihole
      - dnsmasq-config:/etc/dnsmasq.d
    restart: unless-stopped

volumes:
  jellyfin-config:
  jellyfin-cache:
  pihole-config:
  dnsmasq-config:





